apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin-deployment
  namespace: invoices-ns
  labels:
    app: pgadmin

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pgadmin

  template:
    metadata:
      labels:
        app: pgadmin

    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -v -w 2 postgres-service 5432; do
                echo "Waiting for PostgreSQL database to accept connections..."
                sleep 2
              done
              echo "PostgreSQL is up and running!"
              
      containers:
        - name: pgadmin-pod
          image: dpage/pgadmin4:9
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
              name: http
              
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secret
                  key: PGADMIN_EMAIL

            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secret
                  key: PGADMIN_PASSWORD  
          
          volumeMounts:
            - mountPath: pgadmin-data:/var/lib/pgadmin
              name: pg-volume
              
      volumes:
        - name: pg-volume
          emptyDir: {}
              